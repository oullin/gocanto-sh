services:
    go-fmt:
        image: ghcr.io/oullin/go-fmt:v0.1.1
        working_dir: /work
        volumes:
            - .:/work
        environment:
            HOST_PROJECT_PATH: ${PWD}
        entrypoint: ["/bin/sh", "-lc"]
        command:
            - trap 'exit 0' TERM INT; while :; do sleep 3600; done

    go-fmt-support:
        build:
            context: .
            dockerfile: docker/go-fmt-support.Dockerfile
            args:
                GO_FMT_REF: v0.1.1
        working_dir: /work
        volumes:
            - .:/work
        entrypoint: ["/bin/sh", "-lc"]
        command:
            - trap 'exit 0' TERM INT; while :; do sleep 3600; done
