        />
        <meta name="theme-color" content="#0a0a0a" />

            property="og:description"
            content="Hands-on software architect. 20 years shipping regulated backends — payments, banking cores, Kafka pipelines, AS/400 modernisation. Now building AI-agentic systems in Go."

        <meta property="og:image" content="https://gocanto.sh/avatar.jpg" />

        <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
        <title>Gus Ocanto — Software Architect &amp; Principal Engineer · AI-Agentic Systems</title>
        <script>
            (function () {
                try {
                    var stored = localStorage.getItem("theme");
                    var theme = stored === "light" || stored === "dark"
                        ? stored
                        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
                    document.documentElement.dataset.theme = theme;
                } catch (_) {
                    document.documentElement.dataset.theme = "dark";
                }
            })();
        </script>
        <style>
            :root { background: hsl(0 0% 4%); color: hsl(0 0% 93%); }
            :root[data-theme="light"] { background: hsl(0 0% 100%); color: hsl(0 0% 9%); }
        </style>
    </head>
    <body>
        <div id="app">
            <div class="app-loading-shell" aria-hidden="true">
                <div class="app-loading-bar"></div>
                <main class="app-loading-main">
                    <div class="app-loading-line"></div>
                    <div class="app-loading-line"></div>
                    <div class="app-loading-line"></div>
                </main>
            </div>
        </div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
