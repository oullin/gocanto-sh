name: CI

on:
    pull_request:
        types: [opened, reopened, synchronize, ready_for_review]

concurrency:
    group: ci-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    verify:
        if: github.event.pull_request.draft == false
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                task: [format:check, lint, typecheck, test]
        name: ${{ matrix.task }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install fmtkit
              run: |
                  curl -fsSL "https://github.com/oullin/fmtkit/releases/download/v0.5.7/fmtkit_0.5.7_linux_amd64.tar.gz" | tar -xz fmtkit
                  sudo install -m 0755 fmtkit /usr/local/bin/fmtkit
                  rm fmtkit
                  fmtkit version

            - name: Cache turbo
              uses: actions/cache@v4
              with:
                  path: storage/.cache/turbo
                  key: turbo-${{ matrix.task }}-${{ github.sha }}
                  restore-keys: |
                      turbo-${{ matrix.task }}-

            - name: Run ${{ matrix.task }}
              run: pnpm ${{ matrix.task }}
